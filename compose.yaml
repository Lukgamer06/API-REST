services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:Z
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      APP_ENV: local
      DB_CONNECTION: sqlite
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
      COMPOSER_HOME: /tmp/composer
    command: >
      sh -c 'set -eu;
      if [ ! -f .env ]; then cp .env.example .env; fi;
      if [ ! -f database/database.sqlite ]; then touch database/database.sqlite; fi;
      if [ ! -f vendor/autoload.php ]; then composer install --no-interaction --no-security-blocking; fi;
      if ! grep -q "^APP_KEY=base64:" .env; then php artisan key:generate --force; fi;
      exec php artisan serve --host=0.0.0.0 --port=8000'
